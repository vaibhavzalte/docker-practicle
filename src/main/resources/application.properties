spring.application.name=learn-docker

# MySQL Database Configuration
# Port 3355 matches the host port mapped in docker-compose.yml (3355:3306)
spring.datasource.url=jdbc:mysql://localhost:3355/mydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
